[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zed-ai-proxy"
version = "0.2.0"
description = "Multi-account OpenAI and Anthropic compatible reverse proxy for Zed AI models."
authors = [{ name = "sorinqu" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0"
]

[project.scripts]
zed-proxy = "app.cli:main"
zed-ai-proxy = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
